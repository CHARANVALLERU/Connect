static_resources:
  listeners:
    - name: ingress_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: connect_core_services
                      domains: ["*"]
                      routes:
                        # =========================================================
                        # 1. ELITE GATEWAY BARRIER (Sub-10ms Route Rejection)
                        # Rejects non-elite requests before hitting upstream backend
                        # =========================================================
                        - match:
                            prefix: "/api/v1/elite/"
                            headers:
                              - name: "x-connect-tier"
                                string_match:
                                  exact: "elite"
                          route:
                            cluster: elite_upstream_cluster
                            timeout: 2s

                        # Unauthorized Premium attempt to touch /elite route -> 403
                        - match:
                            prefix: "/api/v1/elite/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: '{"error": "FORBIDDEN_TIER_RESTRICTION", "code": 403}'

                        # =========================================================
                        # 2. STREAMING EVENT INGRESS (Kafka buffer bypass)
                        # =========================================================
                        - match:
                            prefix: "/api/v1/telemetry/"
                          route:
                            cluster: telemetry_ingress_cluster
                            timeout: 0.5s

                        # =========================================================
                        # 3. STANDARD CORE API (DMs, Communities, Discovery)
                        # =========================================================
                        - match:
                            prefix: "/api/v1/"
                          route:
                            cluster: connect_backend_cluster
                            timeout: 5s

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: elite_upstream_cluster
      connect_timeout: 0.25s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: elite_upstream_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5001

    - name: telemetry_ingress_cluster
      connect_timeout: 0.10s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: telemetry_ingress_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5002

    - name: connect_backend_cluster
      connect_timeout: 0.50s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: connect_backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5000
